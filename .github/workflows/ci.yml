# CI: en cada push o PR revisamos estilo, corremos los tests y probamos que las imágenes compilen.
# Los tests de model y api son los que exige el README (make model-test / make api-test).
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Instala uv y Python 3.12 (la misma versión del Dockerfile)
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Revisar estilo (ruff)
        run: uv run ruff check .

      - name: Tests del modelo
        run: make model-test

      - name: Tests de la API
        run: make api-test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Solo compila las 3 imágenes, no las sube (eso lo hace cd.yml)
      - name: Build imágenes
        run: |
          docker build -f Dockerfile.api -t api .
          docker build -f Dockerfile.training -t training .
          docker build -f Dockerfile.serving -t serving .